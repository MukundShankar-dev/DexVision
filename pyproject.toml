[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dexvision"
version = "0.2.0"
description = "Shadow Hand manipulation skills in MuJoCo learned with one Diffusion Policy from scripted experts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "av>=12,<20",
    "imageio>=2.34,<3",
    "mujoco>=3.2,<4",
    "numpy>=1.26,<2",
    "PyYAML>=6,<7",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["dexvision*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: minutes on CPU; run with `pytest -m slow`"]
