# Scripted press expert. It sees only the observation fields of configs/tasks/press.yaml. The
# button is part of the fixed scene (assets/mujoco/workcell.xml), so its pose is a constant here,
# the same in every episode. Tuned on train seeds only.

gains:
  position: 0.6            # fraction of the fingertip position error commanded per step
  orientation: 0.5         # fraction of the palm orientation error commanded per step

# The button face: centre (0.110, -0.110, 0.200) minus its 8 mm half-length along x.
button_face_m: [0.102, -0.110, 0.200]
tip_offset_m: [0.011, 0.0, 0.0]  # index pad centre -> fingertip end (the button starts moving at pad x = face - 11 mm)
standoff_m: 0.03           # pad this far in front of the face before pressing
depth_target_m: 0.018      # servo the measured button depth to this (travel 22 mm, task limit 24 mm)
depth_gain: 1.0            # fraction of the depth error corrected per step (all of it: DART noise
                           # of 2 mm per step must not accumulate toward the 24 mm limit)
max_press_step_m: 0.003    # fingertip speed while pressing and releasing: 6 cm/s
pressed_depth_m: 0.0155    # measured depth that counts as pressed for the expert (the task: 15 mm)
hold_steps: 5              # release after this many consecutive pressed steps (the task needs 5)
position_tolerance_m: 0.005
settle_steps: 10           # let the fist close before moving in

# Point: index straight, middle/ring/little curled into a fist, thumb tucked against them.
point_posture: {FFJ3: 0.0, FFJ0: 0.0, MFJ3: 1.5, MFJ0: 2.0, RFJ3: 1.5, RFJ0: 2.0,
                LFJ3: 1.5, LFJ0: 2.0, THJ5: 0.5, THJ4: 1.2, THJ1: 1.0}
