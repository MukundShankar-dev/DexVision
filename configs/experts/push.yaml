# Scripted push expert. It sees only the observation fields of configs/tasks/push.yaml, and its
# parameters may depend only on object shape and size (AGENTS.md rule 4): here they do not depend
# on the object at all. Tuned on train seeds only.

gains:
  position: 0.6            # fraction of the position error commanded per step
  orientation: 0.5         # fraction of the palm orientation error commanded per step

max_push_step_m: 0.004     # hand speed while pushing: 8 cm/s, slow enough that the object follows
position_tolerance_m: 0.01
rotation_tolerance_rad: 0.1
descend_timeout_steps: 30

push_height_m: 0.006       # lowest hand point this far above the table while pushing
standoff_m: 0.03           # gap between the pushing face and the object before the push starts
clearance_m: 0.02          # lowest hand point this far above the object top while moving over it
push_depth_m: 0.01         # how far the push target sits inside the object (keeps contact)

# The hand never turns its fingers more than this from +x: in train rollouts the trailing forearm
# hit the button and wall fixture at 109-131 degrees. The three pushers together face every
# direction within this limit; if the current one cannot, the hand backs off and switches.
max_yaw_rad: 1.5708        # 90 degrees

# Replanning: back off and re-approach when the object leaves the pushing face.
back_off_m: 0.03           # slide the face back this far before rising
max_lateral_error_m: 0.025 # object centre this far off the face's centre line
stop_tolerance_m: 0.008    # stop pushing when the object is this close to the goal
resume_tolerance_m: 0.015  # push again if it drifts this far away while holding

# Pushers: hand postures with a flat face. Each push uses the pusher that needs the least hand
# turn to face the push direction, chosen when an approach starts and kept until the hand backs
# off. Geometry is measured from the hand's collision geoms in that posture (frame: x along the
# fingers, y to the left, both horizontal; offsets are from the grasp point):
#   face_yaw_rad     direction the face pushes, relative to the fingers
#   face_offset_m    the face sits this far ahead of the grasp point along the push direction
#   along_fingers_m  centre of the face along the fingers
#   drop_m           lowest hand point this far below the grasp point
pushers:
  # Index to little finger bent 90 degrees at the knuckle into a wall facing along the fingers;
  # distal joints straight, thumb at neutral 80 mm above the fingertips.
  wall:
    posture: {FFJ3: 1.57, MFJ3: 1.57, RFJ3: 1.57, LFJ3: 1.57}
    roll_rad: 0.0
    pitch_rad: 0.0
    face_yaw_rad: 0.0
    face_offset_m: 0.020
    along_fingers_m: 0.0
    drop_m: 0.068
  # Thumb up, fingers straight and tilted 20 degrees down so the forearm clears the table. The
  # fingers stack into a slab 18 mm thick. Upright, the slab touches tall objects up to 50 mm high
  # and tips the tall cylinder (it tips when pushed above radius / friction = 36 mm), so it leans
  # 30 degrees with its top away from the object: the face is flat from its lowest point up to
  # 20-30 mm and recedes about 10 mm above that. For the palm that is 120 degrees of forearm roll
  # from palm-down (30 past thumb-up toward palm-up); for the back of the hand, 60 degrees.
  palm:                    # pushes left of the fingers
    posture: {}
    roll_rad: 2.094
    pitch_rad: 0.349
    face_yaw_rad: 1.5708
    face_offset_m: -0.005
    along_fingers_m: 0.050
    drop_m: 0.090
  back:                    # pushes right of the fingers
    posture: {}
    roll_rad: 1.047
    pitch_rad: 0.349
    face_yaw_rad: -1.5708
    face_offset_m: 0.054
    along_fingers_m: 0.055
    drop_m: 0.058
