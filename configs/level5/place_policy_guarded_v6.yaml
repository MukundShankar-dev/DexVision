supersedes: V5 selected all three seeds on the complete frozen 48-reset x four-condition slot-B
  validation. A separate nominal all-target development screen on new 940260900 resets exposed
  seed5001 at 24/30 with one large-block board-margin safety failure, one stall, one cylinder
  bounce, two puck bounces and one slip. Paired development probes found a cuboid 0.0245 m
  release trigger avoids that board exit, a forced held-object waypoint resolves the stall,
  and slower cylinder opening avoids its bounce. The combined diagnostic passed 27/30 with
  zero safety and all unchanged state gates on the exposed screen. No V5 confirmation reset
  was used; V6 requires full retraining, selection and fresh confirmation.
