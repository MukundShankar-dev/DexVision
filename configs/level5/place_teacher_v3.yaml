  success_min: 0.95
  worst_family_success_min: 0.9
  safety_violations_max: 0
disclosure: >-
  The validation families, instances and goal types have been exposed. The
  prior 820260900 all-cell matrix informed this recipe. A fresh seed matrix
  is development confirmation for the scripted source only, not a learned
  policy test or unseen-family evidence.
revision_decision: >-
  Saved-state traces showed the large block losing palm contact and then
  tipping during lateral transport. Five to nine bounded tightening samples
  restored physical transport in exposed probes; a bounded wrist yaw cleared
  measured forearm-table contacts at the three positive-x goal regions. Lower
  cylinder/puck transport and a small inboard puck lift addressed separate
  release and board-edge failures. The exact combined exposed probe passed
  30/30 with unchanged physical terminal and safety gates. Freeze this recipe
  before a new all-cell development matrix; preserve every negative attempt.
