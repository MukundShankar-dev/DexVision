decoder: >-
  Hold the measured closed grasp during transport. Near target, use at most
  0.001 m measured position correction per sample. At the family-specific
  release distance inside the frozen 0.025 m gate, latch hand pose, open all
  fingers by the audited coupled increment, and hold through settling.
physics: ordinary_unassisted_no_post_entry_object_pose_or_orientation_writes
