session_rule: One deterministic simulator recording session per split/cell; eight independent
  train resets and four independent validation resets per session. Cell ids repeat across splits,
  but resets, episodes and sessions do not. These are not human, camera, cross-operator or cross-camera
  sessions.
failure_rule: Record every frozen reset and all exact-reset candidate previews. Keep failed
  teacher attempts out of supervision without replacement. Require at least 95 percent success
  per split, 90 percent per family within each split and zero live safety violations before
  immutable publication.
publication_success_min: 0.95
publication_worst_family_success_min: 0.9
episode_namespace: place_unassisted_v3
confirmation_seed_start: 1240260900
confirmation_resets_per_cell: 2
disclosure: All 30 object/target cells, six object instances, five target types and historical
  test families are exposed to scripted source in both splits. Only reset, episode and simulator-session
  ownership is held apart. This state-only source does not claim unseen-cell, unseen-family,
  learned vision, human or cross-operator generalization. Exact-reset preflight is scripted
  planning, not a learned policy; failed resets remain counted.
training_stream: scripted_place_success_only
source_alignment: Only the place interval has causal pre-action observations and applied-action
  labels. The unassisted pick and bounded place setup are replayed exactly but excluded from
  supervision.
amendment: V2 remains immutable and has no successful right-bin source in train or validation;
  its slot-B cells occur only in validation. V15 learned-policy confirmation passed numeric
  gates but failed independent pre-opening hand-table contact audit. V3 expands source coverage
  to all 30 cells in both splits with disjoint new resets and sessions. It does not revise V2
  or any failed attempt.
