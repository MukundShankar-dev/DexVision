version: level5/reach-repair-v1
checkpoint: '5.2A'
parent_config: configs/level5/skills/reach_object.yaml
scope: reach_only_validation_selected_remediation
hypotheses:
  scaling: Near-constant rotation and velocity standard deviations amplify rollout deviations; use fixed physical scales without test statistics.
  invariants: Training targets outside translation are exactly zero; unidentified action channels must hold previous applied values rather than integrate prediction bias.
  relative_goal: Reach trajectory prediction should depend on approach error and tracking lag rather than unrelated absolute entity coordinates and unobserved class channels.
  stopping: Train through the original 100-epoch cap and select candidates using closed-loop validation; compare reached early epochs against late epochs.
seeds: [5001, 5002, 5003]
max_epochs: 100
candidate_epochs: [10, 30, 100]
also_include: [best_offline_validation_epoch, last_executed_epoch]
models:
  physical_scale:
    features: full_physical
    hold_zero_targets: false
  physical_scale_hold:
    features: full_physical
    hold_zero_targets: true
  relative_goal_hold:
    features: relative_goal
    hold_zero_targets: true
physical_scales:
  position_m: 0.1
  rotation_6d: 1.0
  linear_velocity_mps: 1.0
  angular_velocity_radps: 1.0
  joint_position_rad: 1.0
  joint_velocity_radps: 1.0
  action: declared_full_field_range
  scalar_or_binary: 1.0
relative_features:
  - goal_minus_prior_applied_position_xyz
  - prior_applied_minus_measured_position_xyz
zero_target_tolerance: 1.0e-12
screen:
  seed: 5001
  split: validation
  conditions: [nominal]
  unique_resets: 30
  compare_every_candidate: true
  qualification_claim: false
confirmation:
  validation: full_parent_matrix_all_three_seeds
  fresh_reset_seed_start: 520260900
  fresh_reset_count_per_held_out_family: 20
  source_cells: [reach_block_large_held_out, reach_cylinder_tall_held_out, reach_puck_heavy_held_out]
  conditions: [nominal, mild_illumination, partial_occlusion, bounded_distractors]
  freeze_before_method_selection: true
  test_once_after_selection: true
  disclosure: Fresh reset seeds; task families were already evaluated in v1. Original test trajectories do not select the repair.
acceptance:
  success_min: 0.8
  worst_family_success_min: 0.65
  mean_action_jerk_max: 0.023869737935163705
  safety_violations_max: 0
  each_seed_must_pass: true
  manual_review_required: true
  no_expert_at_inference: true
  failed_attempts_retained: true
