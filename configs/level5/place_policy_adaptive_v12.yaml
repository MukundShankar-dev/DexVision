source_exposure: All object families and target types occur in scripted training.
  V11 validation and 1000, 1020, 1040 and 1060 nominal all-target reset sets are
  exposed development evidence. The V12 1080 selection and original 930 confirmation
  resets were unused when this rule was frozen.
reason: Successful source and failed V11 saved states show that repeatedly chasing the
  descending heavy puck lowers the command below its initial release waypoint on
  short-offset inspection-pad grasps. Freeze that initial waypoint only when the
  causal entry command/object vertical gap is under 0.053 m. The seven successful
  training pad grasps had gaps of 0.0565 to 0.0586 m; the lower-gap condition is
  an explicitly exposed extrapolation repair, not a training-distribution claim.
  For cuboids over the left receptacle only, use the measured command/object gap
  and downward object velocity to select one of two bounded coupled opening steps.
  V6 learned move, orientation and release scores, V11 clearance, safety checks,
  source data, frozen 5.4 terminal gates and original confirmation boundary stay
  unchanged. No RGB or unconstrained full-hand learning is claimed.
selection: Keep V6 epochs 80, 20 and 20 predeclared. Run complete V12 validation,
  then a separate fresh 1080 all-target selection screen per seed. Use untouched
  930 confirmation only if all three selected bundles pass every original gate.
