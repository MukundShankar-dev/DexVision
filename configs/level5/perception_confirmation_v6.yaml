method: TRAIN cuboid hue refinement offsets[-2, 8]; exact frozen V22seed11/epoch3000
  pose parameters/input scales/ray decoder retained. Original neural training frontend
  differs; revised frontend fully sequence/stabilization/release/settle validation
  qualified. No weight updates/test tuning.
source: new deterministic scripted experts under ordinary physics; never saved episode
  replay or learned policies
source_failure_rule: retain every reset, failed source and available frame; no replacement
  or success filtering
reset_variation: unchanged Level4 procedural sampler; one nominal and one boundary
  draw per cell/condition
visibility: same calibrated train/validation render visibility; held-out background
  instances hidden explicitly
original_gates:
  recall_minimum: 0.95
  median_position_error_maximum_m: 0.01
  p95_position_error_maximum_m: 0.025
  identity_switches_per_1000_maximum: 1
  synthetic_rejection_fraction: 1.0
supplemental_gates: same gates for primary manipulated targets and every core-class
  recall
delivery_limits:
  minimum_confidence: 0.8
  maximum_age_s: 0.1
denominators: every visible core instance, including missing/rejected estimates; conditional
  position errors counted separately
schema: level5/world-estimate-v1 availability-aware truth/inferred envelope; unchanged
  accepted v1 control schema rejects unsupported fields
unavailable_fields:
- semantic_workcell_identity
- full_orientation_and_angular_velocity
- contact_support_held_and_causal_skill_phase
- fixture_depth
- declared_robot_or_fixture_sensor_telemetry
compatibility: all five accepted state bundles remain unsupported for inferred closed-loop
  control; place collision preview remains privileged
confirmation_rule: 'Development only: train and validation are separate whole sessions;
  no test split; both consumed sets excluded. Fresh confirmation requires a new protocol
  after selection.'
manual_rule: All512cases scored. Owner reviews frozen first nominal/boundary reset
  per cell/condition32clips plus worst primary-pose episode per core class. All512videos
  retained; no best-only/success-only selection.
disclosure: 512fresh ordinary-physics scripted source sessions,32resets per exposed
  cell/condition,disjoint101580000-series. Expanded sample budget and explicit release/settle
  coverage>=8visible from>=4physical sources each are frozen before generation, preventing
  unsupported late-stratum acceptance. All5consumed tests excluded. No replay/pose
  write after reset/outcome filter. Pixel-center simulator/exposed-family/cell only;
  no real-camera/full orientation/semantic identity/contact/sensor/control or5.7qualification.
role: confirmation
