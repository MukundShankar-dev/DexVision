method: Exact validation-selected V11 detector/tracker/body-center model and calibrated
  ray decoder; zero offscreen RGB MSAA matching development V2; no fitting/selection
  on confirmation
source: new deterministic scripted experts under ordinary physics; never saved episode
  replay or learned policies
source_failure_rule: retain every reset, failed source and available frame; no replacement
  or success filtering
reset_variation: unchanged Level4 procedural sampler; one nominal and one boundary
  draw per cell/condition
visibility: same calibrated train/validation render visibility; held-out background
  instances hidden explicitly
original_gates:
  recall_minimum: 0.95
  median_position_error_maximum_m: 0.01
  p95_position_error_maximum_m: 0.025
  identity_switches_per_1000_maximum: 1
  synthetic_rejection_fraction: 1.0
supplemental_gates: same gates for primary manipulated targets and every core-class
  recall
delivery_limits:
  minimum_confidence: 0.8
  maximum_age_s: 0.1
denominators: every visible core instance, including missing/rejected estimates; conditional
  position errors counted separately
schema: level5/world-estimate-v1 availability-aware truth/inferred envelope; unchanged
  accepted v1 control schema rejects unsupported fields
unavailable_fields:
- semantic_workcell_identity
- full_orientation_and_angular_velocity
- contact_support_held_and_causal_skill_phase
- fixture_depth
- declared_robot_or_fixture_sensor_telemetry
compatibility: all five accepted state bundles remain unsupported for inferred closed-loop
  control; place collision preview remains privileged
confirmation_rule: Freeze selected method and all32 new source resets before generation.
  Reserve once per protocol before RGB/label decoding. No reuse or retry of either
  consumed V2 test.
manual_rule: Owner fresh contact-sheet and all32 temporal-episode review after all
  original/core/primary gates pass; no automated owner acceptance.
disclosure: Fresh ordinary-physics source trajectories and simulator sessions on exposed
  families/cells/four original render conditions. New disjoint 95580000-series seeds;
  no replay of development/consumed trajectories, no object pose writes after reset,
  no success filtering. Zero RGB multisampling aligns RGB/masks and bounds qualification
  to this pixel-center convention; no antialiased-input, unseen-family, real-camera
  or accepted-skill control claim. Both consumed V2 tests remain preserved and prohibited
  for fitting/selection/retest. All five accepted bundles stay unsupported on missing
  fields; no 5.7 work.
role: confirmation
splits:
  test:
    seed_start: 95580000
    resets_per_cell_condition: 2
preserved_protocols:
- outputs/level5/perception_confirmation_v1/protocol/protocol.json
- outputs/level5/perception_confirmation_v2/protocol/protocol.json
- outputs/level5/perception_development_v1/protocol/protocol.json
