  Exact V6 weights, V14 wrist rule and every frozen terminal and safety gate remain
  unchanged. These are engineered state-feedback controls, not learned vision or learned
  full-hand control.
selection: Keep V6 epochs 80, 20 and 20 predeclared. Complete V15 validation, then
