  feature_decision: '28 causal scalar features: closure, command/object lift, command
    height, calibrated tracking lag, object-relative position/linear/angular motion
    and relative entry orientation in the prior-command hand frame, support/held/contact
    and three object families. Physical scales: position/lift .1m, linear velocity
    .1m/s, angular velocity 1rad/s, six rotation-matrix error components .1. No absolute
    hand pose or independent joint feedback inputs.'
  target_decision: Rotate three supervised orientation increments into the previous
    applied hand-command frame; decode back to world. Training-proven puck orientation
    deltas are zero and held at inference. Monotone closure and lift; all nonzero
    lift targets require full closure. Bound family lift relative to entry command
    height. Gains at fully closed/fully raised bounds are unidentifiable and masked
    rather than trained to zero; exact target reconstruction remains required.
