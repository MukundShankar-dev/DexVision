action_decision: 'Five learned active outputs: lift gain, three hand-frame orientation
  increments, closure gain. Engineered nonnegative closure/lift, full-closure lift
  interlock, demonstrated maximum family lift, and fixed puck orientation are independently
  audited across training. Zero model output holds within the supported entry-derived
  envelope. No expert queries or object pose writes.'
phase_decision: Recompute acquire/lift/stabilize from current contact-derived held
  state and object height relative to the entry height; never use sequence transport
  labels or the scripted controller's stage. Closure remains supervised before contact.
  Initial object height and rotation are causal entry context, retained throughout.
