method: Exact V25selected current-RGB MLP/transform/scales/calibrated-ray decoder;
  no optimizer or pose updates. Cuboid visual association uses fixed-calibration projection
  of current learned body-center with uncertain new-cube-ID replacement rejection
  while prior cube history fresh. Vetoed history rolls back and new cube IDs after
  expiry explicitly reacquired. Original masks/boxes/current positions preserved.
  Other classes keep original birth/box association. All original tracker limits and
  added99/95identity coverage unchanged. Rejected proposed associations never update
  reliable history. New IDs after expiry declared reacquired. Original gates unchanged,
  additional99%primary/95%supportedphase identity coverage among matches required.
source: new deterministic scripted experts under ordinary physics; never saved episode
  replay or learned policies
source_failure_rule: retain every reset, failed source and available frame; no replacement
  or success filtering
reset_variation: unchanged Level4 procedural sampler; one nominal and one boundary
  draw per cell/condition
visibility: same calibrated train/validation render visibility; held-out background
  instances hidden explicitly
original_gates:
  recall_minimum: 0.95
  median_position_error_maximum_m: 0.01
  p95_position_error_maximum_m: 0.025
  identity_switches_per_1000_maximum: 1
  synthetic_rejection_fraction: 1.0
supplemental_gates: same gates for primary manipulated targets and every core-class
  recall
delivery_limits:
  minimum_confidence: 0.8
  maximum_age_s: 0.1
denominators: every visible core instance, including missing/rejected estimates; conditional
  position errors counted separately
schema: level5/world-estimate-v1 availability-aware truth/inferred envelope; unchanged
  accepted v1 control schema rejects unsupported fields
unavailable_fields:
- semantic_workcell_identity
- full_orientation_and_angular_velocity
- contact_support_held_and_causal_skill_phase
- fixture_depth
- declared_robot_or_fixture_sensor_telemetry
compatibility: all five accepted state bundles remain unsupported for inferred closed-loop
  control; place collision preview remains privileged
confirmation_rule: 'Development only: train and validation are separate whole sessions;
  no test split; both consumed sets excluded. Fresh confirmation requires a new protocol
  after selection.'
manual_rule: All512cases scored. Owner reviews fixed first nominal/boundary reset
  per cell/condition32clips plus worst primary-pose episode per core class. All512videos
  retained; no best-only/success-only selection.
disclosure: 512fresh ordinary-physics scripted source resets,32per exposed cell/condition,disjoint105580000-series.
  All7consumed tests permanently closed; no images/individualcoordinates from them
  used for repair. All outcomes retained, no replay/objectposewrite after reset/filter.
  Same exposed taskfamilies/cells and calibrated simulator pixel-center camera; no
  realcam/unseenfamily/fullpose/semantic/contact/telemetry/control/5.7qualification.
  Separate release/settle>=8visible from>=4physical sources each required; unsupported
  strata cannot qualify by omission.
role: confirmation
splits:
  test:
    seed_start: 105580000
    resets_per_cell_condition: 32
