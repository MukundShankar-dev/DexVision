runtime_dependencies:
  reach:
  - field: requested approach and entity-derived goal xyz
    producer: frozen_calibration_geometry
    consumer: reach V5 geometry decoder
    reason: Explicit fixed request is allowed; deriving an object goal requires certified
      object body pose.
    units: SI physical units or boolean as named
    frame_body_origin: mujoco_world/body origin
    timestamp_rule: pre-action acquisition time aligned to prior command
    confidence_validity: explicit availability; confidence >=0.8 and age <=0.1s; missing
      rejects
    reset_history_rule: initialize from current measured entry; reset every independent
      request; causal past only
    availability: unsupported_or_conditional
  - field: forearm freejoint pose, mocap origin, previous command, weld relpose
    producer: declared_robot_sensor_telemetry
    consumer: reach V5 calibrated_features and decoder
    reason: Encoder/command feedback plus frozen weld transform; simulator freejoint
      state is evaluation-only, no deployment sensor established.
    units: SI physical units or boolean as named
    frame_body_origin: mujoco_world/body origin
    timestamp_rule: pre-action acquisition time aligned to prior command
    confidence_validity: explicit availability; confidence >=0.8 and age <=0.1s; missing
