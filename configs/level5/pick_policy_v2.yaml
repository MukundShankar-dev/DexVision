training_decision: 18401 training frames from 144 episodes; 72 balanced batches per
  epoch. Run all 200 epochs (14400 updates per seed) with no offline-loss early stop.
  Keep the parent 128x128 ReLU MLP, Adam 0.001, batch 256 and uniform cell/episode/frame
  sampling. Causal contact/height phases and finger aperture disambiguate acquisition/lift.
  Report phase errors without additional weights in this first pick experiment; no
  correction data or larger model.
