action_decision: Training independently proves zero planar command, wrist and listed
  abduction deltas across the entire pick interval. Hold only those channels. Learn
  vertical motion, all three rotation axes and 13 varying finger channels. Fixed output
  scales resolve the 0.001m lift step and <=0.02rad orientation feedback without empirically
  tiny divisors. Active channels permit positive and negative deltas. Zero model output
  holds every command. No expert action at inference.
phase_decision: Recompute acquire/lift/stabilize from current contact-derived held
  state and object height relative to the entry height; never use sequence transport
  labels or the scripted controller's stage. Closure remains supervised before contact.
  Initial object height and rotation are causal entry context, retained throughout.
preconditions:
  maximum_grasp_site_distance_m: 0.06
  require_supported: true
  require_unheld: true
  entry_rule: exact_parent_start_frame_no_search
  approach_definition: measured_grasp_site_within_6cm_of_selected_object_center
terminal:
  minimum_height_m: 0.04
  consecutive_samples: 10
  maximum_speed_mps: 0.02
  maximum_retention_gap_samples: 5
  evidence: two_distinct_hand_contact_bodies_and_measured_object_height_motion
  no_table_support_at_success: true
selection: full_parent_validation_matrix_each_candidate_each_seed
confirmation: single_parent_test_matrix_after_validation_selection_each_seed
safety: Preserve frozen Level 4 recording runtime workspace and original actuator/rate
