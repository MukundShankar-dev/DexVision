version: level5/perception-development-v1
checkpoint: '5.6'
parent_recipe: configs/level5/perception_repair_v8.yaml
train_split: datasets/level4-v1/splits/train.json
source_root: data/demos/level4
visual_config: configs/level4_visual_dataset.yaml
workcell_config: configs/workcell.yaml
dataset_config: configs/level4_dataset.yaml
camera_calibration: data/visual/level4/calibration.json
prior_frame_index: data/visual/level4/frames.jsonl
maximum_source_actions: 900
sampling_stride: 5
cells:
- pp_block_small_return_bin_left
- pp_cylinder_short_return_bin_left
- pp_puck_light_return_bin_left
- press_008_centered_nominal
conditions:
- nominal
- mild_illumination
- partial_occlusion
- bounded_distractors
implementation_files:
- dexvision/logging/perception_confirmation.py
- dexvision/evaluation/perception_confirmation.py
- dexvision/perception/world_estimate.py
- dexvision/perception/observation_boundary.py
- dexvision/apps/confirm_perception.py
- dexvision/logging/level4_collection.py
- dexvision/sim/level4_expert.py
- dexvision/sim/scripted_expert_settings.py
- dexvision/perception/render_annotations.py
- dexvision/retargeting/curl_retargeter.py
- dexvision/logging/perception_development.py
- dexvision/evaluation/pick_policy.py
method: Source-only data amendment for validation-selected RGB repair; frozen ancestor
  V8 is provenance, never used to select source outcomes.
source: new deterministic scripted experts under ordinary physics; never saved episode
  replay or learned policies
source_failure_rule: retain every reset, failed source and available frame; no replacement
  or success filtering
reset_variation: unchanged Level4 procedural sampler; one nominal and one boundary
  draw per cell/condition
visibility: same calibrated train/validation render visibility; held-out background
  instances hidden explicitly
original_gates:
  recall_minimum: 0.95
  median_position_error_maximum_m: 0.01
  p95_position_error_maximum_m: 0.025
  identity_switches_per_1000_maximum: 1
  synthetic_rejection_fraction: 1.0
supplemental_gates: same gates for primary manipulated targets and every core-class
  recall
delivery_limits:
  minimum_confidence: 0.8
  maximum_age_s: 0.1
denominators: every visible core instance, including missing/rejected estimates; conditional
  position errors counted separately
schema: level5/world-estimate-v1 availability-aware truth/inferred envelope; unchanged
  accepted v1 control schema rejects unsupported fields
unavailable_fields:
- semantic_workcell_identity
- full_orientation_and_angular_velocity
- contact_support_held_and_causal_skill_phase
- fixture_depth
- declared_robot_or_fixture_sensor_telemetry
compatibility: all five accepted state bundles remain unsupported for inferred closed-loop
  control; place collision preview remains privileged
confirmation_rule: 'Development only: train and validation are separate whole sessions;
  no test split; both consumed sets excluded. Fresh confirmation requires a new protocol
  after selection.'
manual_rule: No acceptance on development; fresh confirmation media required after
  numerical gates.
disclosure: Fresh reset and simulator-session confirmation of exposed object families,
  source cells and four existing render conditions. No unseen-family, real-camera,
  human-operator, independent-camera or deployed-sensor claim. Rendered source failures
  are retained and are not skill-policy trials. Source pixels/actions are generated
  anew; prior episode metadata supplies fixed neutral parameters only. Historical
  consumed V2 test images/labels/inference are never reused. The sparse cadence and
  partial fields cannot qualify any accepted skill or authorize checkpoint 5.7. Missing
  later pick/place and separate reach/push runtime coverage remain explicit unsupported
  compatibility strata. New development sessions expose the same families/cells; no
  unseen-cell claim. Physical truth uses post-forward copied data; live source dynamics
  unchanged.
role: development
splits:
  train:
    seed_start: 94560000
    resets_per_cell_condition: 8
  validation:
    seed_start: 94570000
    resets_per_cell_condition: 2
preserved_protocols:
- outputs/level5/perception_confirmation_v1/protocol/protocol.json
- outputs/level5/perception_confirmation_v2/protocol/protocol.json
prior_frame_indices:
- outputs/level5/perception_confirmation_v2/dataset/frames.jsonl
