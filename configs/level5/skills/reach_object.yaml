      shape:
      - 7
      units: m_and_unit_quaternion
      coordinate_frame: mujoco_world
      required: true
      range:
        position_m:
          min:
          - -0.16
          - -0.16
          - 0.09
          max:
          - 0.2
          - 0.16
          - 0.23
        quaternion_component:
        - -1.0
        - 1.0
  terminal_state_fields:
  - approach_distance_m
  - approach_orientation_error_rad
  - maximum_scene_disturbance_m
  - dwell_steps
  - terminal_reason
  success_metric:
    required_consecutive_samples: 5
    conditions:
    - field: approach_distance_m
      operator: less_equal
      value: 0.025
      units: m
    - field: approach_orientation_error_rad
      operator: less_equal
      value: 0.261799
      units: rad
    - field: maximum_scene_disturbance_m
      operator: less_equal
      value: 0.005
      units: m
  failure_rules:
  - reason: wrong_contact
    predicate: non_goal_entity_contact
    retryable: true
  - reason: workspace_violation
    predicate: base_outside_safe_workspace
    retryable: false
  - reason: timeout
    predicate: timeout_steps_reached
    retryable: true
  timeout_steps: 300
goal_binding:
  entity_id: typed_goal.entity_id
  approach_pose: typed_goal.approach_pose
