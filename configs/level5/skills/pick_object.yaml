evaluation_config: configs/level5/evaluation_common.yaml
source_skill: pick_place_sequence
training:
  stream: expert_success
  segment_skill: pick_object
  interval_rule: saved_segment
  first_contact_phase: null
  expert_episode_count: 144
contract:
  enabled: true
  task_id: pick_object
  episode_group: pick_place
  preconditions:
  - field: object.supported
    operator: equals
    value: true
  - field: object.held
    operator: equals
    value: false
  - field: approach_metric_passed
    operator: equals
    value: true
  goal_fields:
    object_id:
      type: string
      shape: scalar
      units: id
      coordinate_frame: none
      required: true
      allowed_ids:
      - block_small
      - block_large
      - cylinder_short
      - cylinder_tall
      - puck_light
      - puck_heavy
    approach_pose:
      type: float64
      shape:
      - 7
      units: m_and_unit_quaternion
      coordinate_frame: object
      required: false
      range:
        position_m:
          min:
          - -0.08
          - -0.08
          - -0.02
          max:
          - 0.08
          - 0.08
          - 0.1
        quaternion_component:
        - -1.0
        - 1.0
  terminal_state_fields:
  - held_object_id
  - object_height_above_support_m
  - held_dwell_steps
  - terminal_reason
  success_metric:
    required_consecutive_samples: 10
    conditions:
    - field: held_object_id
      operator: equals_goal_field
      value: object_id
      units: id
    - field: object_height_above_support_m
      operator: greater_equal
      value: 0.04
      units: m
  failure_rules:
  - reason: failed_acquisition
    predicate: contact_ended_without_held_state
    retryable: true
  - reason: wrong_contact
    predicate: non_goal_object_held
    retryable: false
  - reason: slip_drop
    predicate: held_then_unsupported_not_in_target
    retryable: false
  timeout_steps: 360
goal_binding:
  object_id: typed_goal.object_id
observation_contract: level5/causal-policy-input-v1
action_contract: level5/bounded-delta-v1
