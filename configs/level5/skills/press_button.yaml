version: level5/skill-protocol-v1
skill: press_button
learning_config: configs/level5/learning.yaml
evaluation_config: configs/level5/evaluation_common.yaml
source_skill: press_button
training:
  stream: expert_success
  segment_skill: press_button
  interval_rule: saved_segment_intersect_from_first_contact_phase
  first_contact_phase: fixture_contact
  expert_episode_count: 96
contract:
  enabled: true
  task_id: press_button
  episode_group: button
  preconditions:
  - field: fixture.present
    operator: equals
    value: true
  - field: approach_metric_passed
    operator: equals
    value: true
  goal_fields:
    button_id:
      type: string
      shape: scalar
      units: id
      coordinate_frame: none
      required: true
      allowed_ids:
      - start_button
    target_press_depth_m:
      type: float64
      shape: scalar
      units: m
      coordinate_frame: fixture_joint
      required: true
      range:
      - 0.008
      - 0.014
    target_pressed_state:
      type: bool
      shape: scalar
      units: bool
      coordinate_frame: none
      required: true
      allowed_ids:
      - true
  terminal_state_fields:
  - button_id
  - press_depth_m
  - target_pressed_state
  - other_button_max_depth_m
  - dwell_steps
  - terminal_reason
  success_metric:
    required_consecutive_samples: 3
    conditions:
    - field: button_id
      operator: equals_goal_field
      value: button_id
      units: id
    - field: press_depth_m
      operator: greater_equal_goal_field
      value: target_press_depth_m
      units: m
    - field: button_pressed
      operator: equals_goal_field
      value: target_pressed_state
      units: bool
    - field: other_button_max_depth_m
      operator: less_equal
      value: 0.002
      units: m
  failure_rules:
  - reason: wrong_contact
    predicate: wrong_fixture_contact
    retryable: false
  - reason: workspace_violation
    predicate: base_outside_safe_workspace
    retryable: false
  - reason: timeout
    predicate: timeout_steps_reached
    retryable: true
  timeout_steps: 240
goal_binding:
  button_id: typed_goal.button_id
  target_press_depth_m: typed_goal.target_press_depth_m
  target_pressed_state: typed_goal.target_pressed_state
observation_contract: level5/causal-policy-input-v1
action_contract: level5/bounded-delta-v1
