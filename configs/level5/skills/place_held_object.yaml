skill: place_held_object
learning_config: configs/level5/learning.yaml
evaluation_config: configs/level5/evaluation_common.yaml
source_skill: pick_place_sequence
training:
  stream: expert_success
  segment_skill: place_held_object
  interval_rule: saved_segment
  first_contact_phase: null
  expert_episode_count: 144
contract:
  enabled: true
  task_id: place_held_object
  episode_group: pick_place
  preconditions:
  - field: held_object_count
    operator: equals
    value: 1
  - field: held_object_id
    operator: equals_goal_field
    value: object_id
  goal_fields:
    object_id:
      type: string
      shape: scalar
      units: id
      coordinate_frame: none
      required: true
      allowed_ids:
      - block_small
      - block_large
      - cylinder_short
      - cylinder_tall
      - puck_light
      - puck_heavy
    target_id:
      type: string
      shape: scalar
      units: id
      coordinate_frame: none
      required: true
      allowed_ids:
      - return_bin_left
      - return_bin_right
      - inspection_pad
      - setup_slot_a
      - setup_slot_b
  terminal_state_fields:
  - object_to_target_distance_m
  - object_linear_speed_mps
  - object_angular_speed_radps
  - object_upright_tilt_rad
  - object_inside_target
  - object_supported
  - held_object_id
  - settle_steps
  - terminal_reason
  success_metric:
    required_consecutive_samples: 10
    conditions:
    - field: object_to_target_distance_m
      operator: less_equal
      value: 0.025
      units: m
    - field: object_inside_target
      operator: equals
      value: true
      units: bool
    - field: object_supported
      operator: equals
      value: true
      units: bool
    - field: held_object_id
      operator: equals
      value: null
      units: id
    - field: object_linear_speed_mps
      operator: less_equal
      value: 0.02
      units: m_per_s
    - field: object_angular_speed_radps
      operator: less_equal
      value: 0.2
      units: rad_per_s
  failure_rules:
  - reason: placement_miss
    predicate: released_outside_target
    retryable: true
  - reason: premature_release
    predicate: released_before_place_phase
    retryable: false
  - reason: slip_drop
    predicate: unsupported_drop_before_target
    retryable: false
  timeout_steps: 450
goal_binding:
  object_id: unique_held_object_matching_parent_object_id
  target_id: typed_goal.target_id
observation_contract: level5/causal-policy-input-v1
action_contract: level5/bounded-delta-v1
