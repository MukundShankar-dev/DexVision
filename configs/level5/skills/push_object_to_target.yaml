source_skill: push_object_to_target
training:
  stream: expert_success
  segment_skill: push_object_to_target
  interval_rule: saved_segment_intersect_from_first_contact_phase
  first_contact_phase: push_contact
  expert_episode_count: 96
contract:
  enabled: true
  task_id: push_object_to_target
  episode_group: push
  preconditions:
  - field: object.supported
    operator: equals
    value: true
  - field: object.family
    operator: in
    value:
    - cuboid
    - flat_puck
  - field: approach_metric_passed
    operator: equals
    value: true
  goal_fields:
    object_id:
      type: string
      shape: scalar
      units: id
      coordinate_frame: none
      required: true
      allowed_ids:
      - block_small
      - block_large
      - puck_light
      - puck_heavy
    target_zone:
      type: string
      shape: scalar
      units: id
      coordinate_frame: none
      required: true
      allowed_ids:
      - return_bin_left
      - return_bin_right
      - inspection_pad
      - setup_slot_a
      - setup_slot_b
  terminal_state_fields:
  - planar_object_to_target_distance_m
  - object_linear_speed_mps
  - object_on_board
  - object_supported
  - object_upright_tilt_rad
  - dwell_steps
  - terminal_reason
  success_metric:
    required_consecutive_samples: 5
    conditions:
    - field: planar_object_to_target_distance_m
      operator: less_equal
      value: 0.035
      units: m
    - field: object_on_board
      operator: equals
      value: true
      units: bool
    - field: object_supported
      operator: equals
      value: true
      units: bool
    - field: object_upright_tilt_rad
      operator: less_equal
      value: 0.174533
      units: rad
    - field: object_linear_speed_mps
      operator: less_equal
      value: 0.02
      units: m_per_s
  failure_rules:
  - reason: wrong_contact
    predicate: non_goal_object_displaced
    retryable: false
  - reason: object_workspace_violation
    predicate: object_outside_board_margin
    retryable: false
  - reason: timeout
    predicate: timeout_steps_reached
    retryable: true
  timeout_steps: 300
goal_binding:
  object_id: typed_goal.object_id
  target_zone: typed_goal.target_zone
observation_contract: level5/causal-policy-input-v1
action_contract: level5/bounded-delta-v1
