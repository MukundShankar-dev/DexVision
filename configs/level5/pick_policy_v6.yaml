action_decision: 'Three learned scalars: closure increment, lift speed, orientation
  correction magnitude. Engineered closure synergy, positive lift with full-closure
  interlock and family travel bounds, plus causal geometric orientation direction
  toward entry reference (cuboid full rotation, cylinder axial, puck fixed). Correction
  never exceeds remaining error or0.02001rad per sample. No expert commands or object-state
  writes at inference. Targets reconstruct source within2e-6rad; this tolerance discloses
  the legacy teacher quaternion-interpolation approximation.'
phase_decision: Recompute acquire/lift/stabilize from current contact-derived held
  state and object height relative to the entry height; never use sequence transport
  labels or the scripted controller's stage. Closure remains supervised before contact.
  Initial object height and rotation are causal entry context, retained throughout.
