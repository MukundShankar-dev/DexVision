revision_decision: >-
  V1 source feasibility was 28/30: one cuboid grip loss and one cylinder
  rebound despite zero safety interventions. A validation-only paired
  diagnostic on the rebound reset succeeded when the audited opening step
  was halved. Freeze that single rate change here before repeating the full
  thirty-reset development screen. Preserve V1 outcomes and all frozen
  place qualification thresholds.
