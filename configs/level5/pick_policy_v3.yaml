action_decision: Learn vertical delta, three rotation deltas and one signed closure
  fraction increment (output8, max .05/sample). Decoder supplies audited closure direction
  and no aperture overshoot. Other varying finger coordinates masked because exactly
  rank one across training; closure stays learned. Hold original nine invariant channels.
  No object orientation hold or expert control at inference.
phase_decision: Recompute acquire/lift/stabilize from current contact-derived held
  state and object height relative to the entry height; never use sequence transport
  labels or the scripted controller's stage. Closure remains supervised before contact.
  Initial object height and rotation are causal entry context, retained throughout.
