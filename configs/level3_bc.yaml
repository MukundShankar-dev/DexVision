version: level3/bc-training-v1
skill_name: reach_touch_target

dataset:
  root: data/demos/raw
  evaluation_config: configs/level3_evaluation.yaml
  include_previous_action: false
  observation_fields:
    - robot_qpos
    - robot_qvel
    - base_position
    - base_orientation
    - finger_joint_positions
    - finger_joint_velocities
    - object_state
    - tracking_quality

model:
  hidden_dims: [128, 128]
  activation: relu
  # null means the complete saved Level 1.13 action layout.
  output_action_names: null

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  seed: 20260903
  num_workers: 0
  device: cpu

output:
  directory: outputs/level3/reach_bc_v1
  checkpoint_name: policy.pt
