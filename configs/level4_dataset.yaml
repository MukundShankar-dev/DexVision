version: level4/workcell-dataset-plan-v1

freeze:
  checkpoint: Level 4.0
  status: requirements_frozen
  collection_started: false
  frozen_date: "2026-09-03"
  change_policy: create_new_version_with_compatibility_note
  level4_3_count_revision_requires_pilot_evidence: true
  coverage_count_status: provisional_pending_level4_3_pilot

pilot:
  version: level4/collection-pilot-v1
  status: pending_collection_and_manual_replay
  dataset_dir: data/demos/level4_pilot
  reach_rate_control:
    mapping: centered_velocity_joystick
    image_deadband: 0.035
    image_full_scale: 0.22
    depth_deadband: 0.05
    depth_full_scale: 0.35
    response_exponent: 2.0
    max_velocity_m_s: [0.12, 0.15, 0.10]
    transit_height_m: 0.19
    descent_radius_m: 0.035
  scripted_reach:
    planner: rise_horizontal_protected_corridor_descent
    planning_point: grasp_site
    transit_height_m: 0.22
    corridor_entry_height_m: 0.18
    max_position_step_m: 0.01
    waypoint_tolerance_m: 0.000001
    required_goal_dwell_steps: 5
    sim_steps_per_action: 17
    maximum_non_target_disturbance_m: 0.005
    joint_limit_tolerance_rad: 0.000001
  scripted_button:
    controller: fixed_posture_normal_press
    planning_point: grasp_site
    transit_height_m: 0.22
    precontact_offset_m: [-0.15, -0.011, -0.035]
    press_offset_m: [-0.095, -0.011, -0.035]
    transit_step_m: 0.01
    press_step_m: 0.002
    retract_step_m: 0.005
    waypoint_tolerance_m: 0.000001
    required_press_dwell_steps: 3
    release_depth_m: 0.002
    release_hold_steps: 5
    sim_steps_per_action: 17
    maximum_non_target_disturbance_m: 0.005
    joint_limit_tolerance_rad: 0.0005
  scripted_push:
    controller: fixed_index_task_axis_push
    planning_point: grasp_site
    posture: index_partially_flexed_others_flexed
    trial_setup:
      mode: selected_object_on_workcell_non_targets_on_floor_parking
      parking_x_m: -0.35
      parking_y_m: [-0.12, -0.06, 0.0, 0.06, 0.12]
      parking_surface_z_m: -0.10
    transit_height_m: 0.22
    approach_gap_m: 0.03
    fingertip_lateral_offset_m: 0.0325
    family_parameters:
      cuboid:
        wrist_pitch_deg: 45.0
        control_height_m: 0.09
        fingertip_forward_offset_m: 0.0645
        control_side: ahead
        index_curl: 0.30
      flat_puck:
        wrist_pitch_deg: 78.0
        control_height_m: 0.102
        fingertip_forward_offset_m: 0.056
        control_side: behind
        index_curl: 0.0
    transit_step_m: 0.01
    descent_step_m: 0.005
    push_step_m: 0.002
    target_stop_distance_m: 0.030
    retract_distance_m: 0.04
    retract_step_m: 0.005
    orientation_step_rad: 0.05
    waypoint_tolerance_m: 0.000001
    required_goal_dwell_steps: 5
    release_hold_steps: 3
    required_terminal_dwell_steps: 5
    maximum_object_tilt_rad: 0.174533
    maximum_push_actions: 180
    sim_steps_per_action: 17
    maximum_non_target_disturbance_m: 0.005
    joint_limit_tolerance_rad: 0.01
  scripted_grasp:
    controller: object_relative_family_grasp_lift
    planning_point: grasp_site
    hand_poses:
      open: configured_retargeter_open
      closed: configured_retargeter_full_flexion
    trial_setup:
      mode: selected_object_on_workcell_non_targets_on_floor_parking
      parking_x_m: -0.35
      parking_y_m: [-0.12, -0.06, 0.0, 0.06, 0.12]
      parking_surface_z_m: -0.10
    transit_height_m: 0.22
    transit_step_m: 0.01
    descent_step_m: 0.005
    lift_step_m: 0.001
    synergy_step: 0.05
    orientation_step_rad: 0.05
    waypoint_tolerance_m: 0.000001
    required_hold_steps: 10
    maximum_retention_gap_steps: 5
    maximum_hold_speed_m_s: 0.02
    sim_steps_per_action: 17
    maximum_non_target_disturbance_m: 0.005
    joint_limit_tolerance_rad: 0.03
    family_templates:
      cuboid:
        object_relative_position_m: [0.0, -0.06, 0.032]
        wrist_orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
        grasp_synergy: 0.9
        lift_distance_m: 0.08
      cylinder:
        object_relative_position_m: [-0.01, -0.06, 0.032]
        wrist_orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
        grasp_synergy: 0.9
        lift_distance_m: 0.10
      flat_puck:
        object_relative_position_m: [-0.04, -0.04, 0.016]
        wrist_orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
        grasp_synergy: 1.0
        lift_distance_m: 0.11
  minimum_genuine_sessions: 2
  minimum_accepted_episodes:
    reach: 5
    pick_place: 10
    push: 5
    button: 5
  ordinary_failures_preserved_separately: true
  expert_acceptance_review_filename: pilot_review.json
  manual_replay_manifest_filename: manual_replay_manifest.json
  replay_requirements:
    headless_replay_for_every_accepted_episode: true
    recomputed_terminal_success_for_every_accepted_episode: true
    manual_replay_one_per_required_skill: true
  storage_projection:
    basis: mean_pilot_episode_bytes_times_required_planning_maximum
    git_lfs_max_projected_payload_bytes: 2147483648
    above_threshold_payload_handling: external_object_storage
  final_count_freeze_requires:
    - pilot_minima_pass
    - all_object_families_and_target_types_observed
    - per_cell_minima_fit_required_episode_envelope
    - storage_payload_handling_decided
    - manual_replay_gate_confirmed_by_user

evidence_sources:
  - docs/level3_results.md
  - outputs/level3/feasibility_v1/summary.json
  - docs/level3_evaluation_protocol.md
  - configs/level3_evaluation.yaml
  - configs/level3_button_evaluation.yaml
  - configs/level3_push_evaluation.yaml
  - datasets/dexvision_level2_v1_manifest.json
  - datasets/dexvision_level2_v1.tar.gz.sha256
  - data/demos/reports/summaries/dataset_summary.json
  - docs/task_environment.md

dataset:
  name: dexvision_level4_workcell_v1
  release_name: level4-v1
  legacy_seed_release: dexvision_level2_v1
  legacy_seed_counts_toward_new_minimum: false
  accepted_episode_policy: immutable_append_only
  primary_claim: named_rigid_objects_in_one_bounded_fixed_camera_tabletop_workcell

schema_versions:
  episode: level4/episode-v1
  observation: level4/observation-v1
  action: level4/request-command-apply-v1
  world_state: level4/world-state-v1
  phase: level4/causal-phase-v1
  safety: level4/action-safety-v1
  rgb: level4/fixed-camera-rgb-v1
  coverage: level4/coverage-matrix-v1

workcell:
  coordinate_frame: mujoco_world
  length_units: m
  angle_units: rad
  time_units: s
  safe_workspace:
    min: [-0.18, -0.18, 0.01]
    max: [0.22, 0.18, 0.24]
    margin_m: 0.005
    coordinate_frame: mujoco_world
    units: m
  board_workspace:
    min_xy_m: [-0.16, -0.14]
    max_xy_m: [0.16, 0.14]
    safe_edge_margin_m: 0.015
  object_families:
    cuboid:
      class_id: rigid_cuboid
      push_compatible: true
      pick_compatible: true
    cylinder:
      class_id: rigid_cylinder
      push_compatible: false
      pick_compatible: true
    flat_puck:
      class_id: rigid_flat_puck
      push_compatible: true
      pick_compatible: true
  objects:
    block_small:
      family: cuboid
      split_role: training_pool
      geometry: {shape: box, size_m: [0.035, 0.035, 0.035]}
      mass_kg: 0.045
      friction: [0.8, 0.01, 0.001]
    block_large:
      family: cuboid
      split_role: held_out_test_only
      geometry: {shape: box, size_m: [0.050, 0.030, 0.040]}
      mass_kg: 0.070
      friction: [0.65, 0.01, 0.001]
    cylinder_short:
      family: cylinder
      split_role: training_pool
      geometry: {shape: cylinder, radius_m: 0.022, height_m: 0.035}
      mass_kg: 0.050
      friction: [0.75, 0.01, 0.001]
    cylinder_tall:
      family: cylinder
      split_role: held_out_test_only
      geometry: {shape: cylinder, radius_m: 0.018, height_m: 0.060}
      mass_kg: 0.060
      friction: [0.70, 0.01, 0.001]
    puck_light:
      family: flat_puck
      split_role: training_pool
      geometry: {shape: cylinder, radius_m: 0.030, height_m: 0.012}
      mass_kg: 0.025
      friction: [0.55, 0.01, 0.001]
    puck_heavy:
      family: flat_puck
      split_role: held_out_test_only
      geometry: {shape: cylinder, radius_m: 0.026, height_m: 0.016}
      mass_kg: 0.080
      friction: [0.90, 0.01, 0.001]
  fixtures:
    start_button:
      fixture_type: pressable_button
      split_role: all_splits
      position_m: [0.11, -0.11, 0.20]
      press_axis: [1.0, 0.0, 0.0]
      depth_range_m: [0.008, 0.014]
  targets:
    return_bin_left:
      target_type: receptacle
      split_role: training_pool
      center_m: [0.10, 0.11, 0.02]
      tolerance_radius_m: 0.025
    return_bin_right:
      target_type: receptacle
      split_role: held_out_test_only
      center_m: [0.10, -0.11, 0.02]
      tolerance_radius_m: 0.025
    inspection_pad:
      target_type: planar_zone
      split_role: training_pool
      center_m: [0.02, 0.00, 0.01]
      tolerance_radius_m: 0.025
    setup_slot_a:
      target_type: placement_slot
      split_role: training_pool
      center_m: [-0.07, -0.06, 0.01]
      tolerance_radius_m: 0.025
    setup_slot_b:
      target_type: placement_slot
      split_role: validation_only
      center_m: [-0.07, 0.06, 0.01]
      tolerance_radius_m: 0.025

reset_ranges:
  cuboid:
    position_range_m: {min: [-0.11, -0.09, 0.018], max: [-0.04, 0.09, 0.025]}
    yaw_range_rad: [-0.35, 0.35]
    bands: [interior, near_boundary]
  cylinder:
    position_range_m: {min: [-0.11, -0.09, 0.018], max: [-0.04, 0.09, 0.032]}
    yaw_range_rad: [-3.141593, 3.141593]
    bands: [interior, near_boundary]
  flat_puck:
    position_range_m: {min: [-0.11, -0.09, 0.008], max: [-0.04, 0.09, 0.012]}
    yaw_range_rad: [-3.141593, 3.141593]
    bands: [interior, near_boundary]
  robot_base:
    position_range_m: {min: [-0.16, -0.16, 0.09], max: [0.20, 0.16, 0.23]}
    orientation_delta_range_rad: {roll: [-0.35, 0.35], pitch: [-0.35, 0.35], yaw: [-0.52, 0.52]}

skills:
  reach_object:
    enabled: true
    task_id: reach_object
    episode_group: reach
    preconditions:
      - {field: robot.safe_neutral, operator: equals, value: true}
      - {field: goal.entity_id, operator: present, value: true}
      - {field: entity.state_age_s, operator: less_equal, value: 0.10, units: s}
    goal_fields:
      entity_id: {type: string, shape: scalar, units: id, coordinate_frame: none, required: true, allowed_ids: [block_small, block_large, cylinder_short, cylinder_tall, puck_light, puck_heavy, start_button, inspection_pad, setup_slot_a, setup_slot_b]}
      approach_pose: {type: float64, shape: [7], units: "m_and_unit_quaternion", coordinate_frame: mujoco_world, required: true, range: {position_m: {min: [-0.16, -0.16, 0.09], max: [0.20, 0.16, 0.23]}, quaternion_component: [-1.0, 1.0]}}
    terminal_state_fields: [approach_distance_m, approach_orientation_error_rad, maximum_scene_disturbance_m, dwell_steps, terminal_reason]
    success_metric:
      required_consecutive_samples: 5
      conditions:
        - {field: approach_distance_m, operator: less_equal, value: 0.025, units: m}
        - {field: approach_orientation_error_rad, operator: less_equal, value: 0.261799, units: rad}
        - {field: maximum_scene_disturbance_m, operator: less_equal, value: 0.005, units: m}
    failure_rules:
      - {reason: wrong_contact, predicate: non_goal_entity_contact, retryable: true}
      - {reason: workspace_violation, predicate: base_outside_safe_workspace, retryable: false}
      - {reason: timeout, predicate: timeout_steps_reached, retryable: true}
    timeout_steps: 300
  pick_object:
    enabled: true
    task_id: pick_object
    episode_group: pick_place
    preconditions:
      - {field: object.supported, operator: equals, value: true}
      - {field: object.held, operator: equals, value: false}
      - {field: approach_metric_passed, operator: equals, value: true}
    goal_fields:
      object_id: {type: string, shape: scalar, units: id, coordinate_frame: none, required: true, allowed_ids: [block_small, block_large, cylinder_short, cylinder_tall, puck_light, puck_heavy]}
      approach_pose: {type: float64, shape: [7], units: "m_and_unit_quaternion", coordinate_frame: object, required: false, range: {position_m: {min: [-0.08, -0.08, -0.02], max: [0.08, 0.08, 0.10]}, quaternion_component: [-1.0, 1.0]}}
    terminal_state_fields: [held_object_id, object_height_above_support_m, held_dwell_steps, terminal_reason]
    success_metric:
      required_consecutive_samples: 10
      conditions:
        - {field: held_object_id, operator: equals_goal_field, value: object_id, units: id}
        - {field: object_height_above_support_m, operator: greater_equal, value: 0.040, units: m}
    failure_rules:
      - {reason: failed_acquisition, predicate: contact_ended_without_held_state, retryable: true}
      - {reason: wrong_contact, predicate: non_goal_object_held, retryable: false}
      - {reason: slip_drop, predicate: held_then_unsupported_not_in_target, retryable: false}
    timeout_steps: 360
  place_held_object:
    enabled: true
    task_id: place_held_object
    episode_group: pick_place
    preconditions:
      - {field: held_object_count, operator: equals, value: 1}
      - {field: held_object_id, operator: equals_goal_field, value: object_id}
    goal_fields:
      object_id: {type: string, shape: scalar, units: id, coordinate_frame: none, required: true, allowed_ids: [block_small, block_large, cylinder_short, cylinder_tall, puck_light, puck_heavy]}
      target_id: {type: string, shape: scalar, units: id, coordinate_frame: none, required: true, allowed_ids: [return_bin_left, return_bin_right, inspection_pad, setup_slot_a, setup_slot_b]}
    terminal_state_fields: [object_to_target_distance_m, object_linear_speed_mps, object_inside_target, held_object_id, settle_steps, terminal_reason]
    success_metric:
      required_consecutive_samples: 10
      conditions:
        - {field: object_to_target_distance_m, operator: less_equal, value: 0.025, units: m}
        - {field: object_inside_target, operator: equals, value: true, units: bool}
        - {field: held_object_id, operator: equals, value: null, units: id}
        - {field: object_linear_speed_mps, operator: less_equal, value: 0.020, units: m_per_s}
    failure_rules:
      - {reason: placement_miss, predicate: released_outside_target, retryable: true}
      - {reason: premature_release, predicate: released_before_place_phase, retryable: false}
      - {reason: slip_drop, predicate: unsupported_drop_before_target, retryable: false}
    timeout_steps: 450
  push_object_to_target:
    enabled: true
    task_id: push_object_to_target
    episode_group: push
    preconditions:
      - {field: object.supported, operator: equals, value: true}
      - {field: object.family, operator: in, value: [cuboid, flat_puck]}
      - {field: approach_metric_passed, operator: equals, value: true}
    goal_fields:
      object_id: {type: string, shape: scalar, units: id, coordinate_frame: none, required: true, allowed_ids: [block_small, block_large, puck_light, puck_heavy]}
      target_zone: {type: string, shape: scalar, units: id, coordinate_frame: none, required: true, allowed_ids: [return_bin_left, return_bin_right, inspection_pad, setup_slot_a, setup_slot_b]}
    terminal_state_fields: [planar_object_to_target_distance_m, object_linear_speed_mps, object_on_board, object_supported, object_upright_tilt_rad, dwell_steps, terminal_reason]
    success_metric:
      required_consecutive_samples: 5
      conditions:
        - {field: planar_object_to_target_distance_m, operator: less_equal, value: 0.035, units: m}
        - {field: object_on_board, operator: equals, value: true, units: bool}
        - {field: object_supported, operator: equals, value: true, units: bool}
        - {field: object_upright_tilt_rad, operator: less_equal, value: 0.174533, units: rad}
        - {field: object_linear_speed_mps, operator: less_equal, value: 0.020, units: m_per_s}
    failure_rules:
      - {reason: wrong_contact, predicate: non_goal_object_displaced, retryable: false}
      - {reason: object_workspace_violation, predicate: object_outside_board_margin, retryable: false}
      - {reason: timeout, predicate: timeout_steps_reached, retryable: true}
    timeout_steps: 300
  press_button:
    enabled: true
    task_id: press_button
    episode_group: button
    preconditions:
      - {field: fixture.present, operator: equals, value: true}
      - {field: approach_metric_passed, operator: equals, value: true}
    goal_fields:
      button_id: {type: string, shape: scalar, units: id, coordinate_frame: none, required: true, allowed_ids: [start_button]}
      target_press_depth_m: {type: float64, shape: scalar, units: m, coordinate_frame: fixture_joint, required: true, range: [0.008, 0.014]}
      target_pressed_state: {type: bool, shape: scalar, units: bool, coordinate_frame: none, required: true, allowed_ids: [true]}
    terminal_state_fields: [button_id, press_depth_m, target_pressed_state, other_button_max_depth_m, dwell_steps, terminal_reason]
    success_metric:
      required_consecutive_samples: 3
      conditions:
        - {field: button_id, operator: equals_goal_field, value: button_id, units: id}
        - {field: press_depth_m, operator: greater_equal_goal_field, value: target_press_depth_m, units: m}
        - {field: button_pressed, operator: equals_goal_field, value: target_pressed_state, units: bool}
        - {field: other_button_max_depth_m, operator: less_equal, value: 0.002, units: m}
    failure_rules:
      - {reason: wrong_contact, predicate: wrong_fixture_contact, retryable: false}
      - {reason: workspace_violation, predicate: base_outside_safe_workspace, retryable: false}
      - {reason: timeout, predicate: timeout_steps_reached, retryable: true}
    timeout_steps: 240

optional_skills:
  rotate_dial:
    enabled: false
    fixture_id: mode_dial
    required_episode_minimum: 0
    promotion_checkpoint: Level 4.3
    promoted_budget_is_additional: true
    promotion_requires_successful_pilot: true
    level4_3_decision: deferred
    level4_3_decision_reason: required_skill_pilot_and_coverage_take_priority

phase_contract:
  version: level4/causal-phase-v1
  vocabulary: [approach, acquire, lift, stabilize, transport, place, release, settle, push_contact, fixture_contact, retract]
  store_online_phase: true
  store_audited_annotation_separately: true
  report_disagreement: true
  irrelevant_action_behavior: hold_previous_applied
  action_relevance_masks:
    approach: {base_position: true, base_orientation: true, wrist: true, fingers: false}
    acquire: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    lift: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    stabilize: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    transport: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    place: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    release: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    settle: {base_position: false, base_orientation: false, wrist: false, fingers: false}
    push_contact: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    fixture_contact: {base_position: true, base_orientation: true, wrist: true, fingers: true}
    retract: {base_position: true, base_orientation: true, wrist: true, fingers: false}

online_phase_state_machine:
  version: level4/causal-phase-v1
  causal: true
  allowed_inputs: [current_world_state, prior_world_state, task_request, current_terminal_metrics, previous_online_phase]
  future_frames_allowed: false
  audited_annotation_used_online: false
  transition_evaluation: ordered_first_match_once_per_control_sample
  machines:
    reach_object:
      initial_phase: approach
      transitions:
        - {from: approach, to: retract, predicate: reach_success_dwell_passed}
    pick_object:
      initial_phase: approach
      transitions:
        - {from: approach, to: acquire, predicate: approach_success_dwell_passed}
        - {from: acquire, to: lift, predicate: requested_object_held_now}
        - {from: lift, to: stabilize, predicate: requested_object_above_lift_height_now}
        - {from: stabilize, to: retract, predicate: pick_success_dwell_passed}
    place_held_object:
      initial_phase: transport
      transitions:
        - {from: transport, to: place, predicate: requested_object_inside_target_now}
        - {from: place, to: release, predicate: release_started_now}
        - {from: release, to: settle, predicate: requested_object_not_held_now}
        - {from: settle, to: retract, predicate: place_success_dwell_passed}
    push_object_to_target:
      initial_phase: approach
      transitions:
        - {from: approach, to: push_contact, predicate: requested_object_contact_started_now}
        - {from: push_contact, to: settle, predicate: requested_object_inside_target_now}
        - {from: settle, to: retract, predicate: push_success_dwell_passed}
    press_button:
      initial_phase: approach
      transitions:
        - {from: approach, to: fixture_contact, predicate: requested_button_contact_started_now}
        - {from: fixture_contact, to: retract, predicate: press_success_dwell_passed}

action_contract:
  version: level4/request-command-apply-v1
  layout_version: level1.13/full-action-v1
  representation: absolute_targets
  complete_named_layout_in_every_stage: true
  nominal_control_interval_s: 0.03333333333333333
  measured_control_interval_recorded: true
  stages:
    requested:
      semantics: source_requested_action_before_controller_resolution
      request_sources: [operator, script, policy]
      timestamp_required: true
    commanded:
      semantics: complete_absolute_action_after_controller_resolution_before_safety
      before_safety_handling: true
      timestamp_required: true
    applied:
      semantics: complete_absolute_action_after_clip_rate_limit_rejection_or_fallback
      after_safety_handling: true
      timestamp_required: true
  record_prior_commanded: true
  record_prior_applied: true
  resulting_state_timestamp_required: true
  per_field_safety_mask: true
  per_field_safety_reason_code: true
  unsafe_motion_is_expert_target: false
  expert_target_stage: applied
  residual_target_derivation:
    deterministic: true
    base: applied_minus_prior_applied
    actuator: applied_minus_prior_applied
    orientation: sign_continuous_relative_quaternion_from_prior_applied
  quaternion:
    field_order: [qw, qx, qy, qz]
    convention: mujoco_wxyz
    normalization_required: true
    sign_continuity_required: true
    sign_rule: maximize_dot_with_previous_applied
    first_sample_canonical_rule: "qw_positive_else_first_nonzero_component_positive"
    maximum_angular_change_per_sample_rad: 0.139626
  named_layout:
    - {index: 0, name: base_position_target/x, group: base_position, units: m, coordinate_frame: mujoco_world, semantics: absolute, lower: -0.18, upper: 0.22, max_change_per_sample: 0.025}
    - {index: 1, name: base_position_target/y, group: base_position, units: m, coordinate_frame: mujoco_world, semantics: absolute, lower: -0.18, upper: 0.18, max_change_per_sample: 0.025}
    - {index: 2, name: base_position_target/z, group: base_position, units: m, coordinate_frame: mujoco_world, semantics: absolute, lower: 0.08, upper: 0.24, max_change_per_sample: 0.025}
    - {index: 3, name: base_orientation_target/qw, group: base_orientation, units: unit_quaternion, coordinate_frame: mujoco_world_from_hand_base, semantics: absolute, lower: -1.0, upper: 1.0, max_change_per_sample: 0.14}
    - {index: 4, name: base_orientation_target/qx, group: base_orientation, units: unit_quaternion, coordinate_frame: mujoco_world_from_hand_base, semantics: absolute, lower: -1.0, upper: 1.0, max_change_per_sample: 0.14}
    - {index: 5, name: base_orientation_target/qy, group: base_orientation, units: unit_quaternion, coordinate_frame: mujoco_world_from_hand_base, semantics: absolute, lower: -1.0, upper: 1.0, max_change_per_sample: 0.14}
    - {index: 6, name: base_orientation_target/qz, group: base_orientation, units: unit_quaternion, coordinate_frame: mujoco_world_from_hand_base, semantics: absolute, lower: -1.0, upper: 1.0, max_change_per_sample: 0.14}
    - {index: 7, name: finger_actuator_targets/rh_A_WRJ2, group: wrist, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.524, upper: 0.175, max_change_per_sample: 0.15}
    - {index: 8, name: finger_actuator_targets/rh_A_WRJ1, group: wrist, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.698, upper: 0.489, max_change_per_sample: 0.15}
    - {index: 9, name: finger_actuator_targets/rh_A_THJ5, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -1.047, upper: 1.047, max_change_per_sample: 0.15}
    - {index: 10, name: finger_actuator_targets/rh_A_THJ4, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: 0.0, upper: 1.222, max_change_per_sample: 0.15}
    - {index: 11, name: finger_actuator_targets/rh_A_THJ3, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.209, upper: 0.209, max_change_per_sample: 0.15}
    - {index: 12, name: finger_actuator_targets/rh_A_THJ2, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.698, upper: 0.698, max_change_per_sample: 0.15}
    - {index: 13, name: finger_actuator_targets/rh_A_THJ1, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.262, upper: 1.571, max_change_per_sample: 0.15}
    - {index: 14, name: finger_actuator_targets/rh_A_FFJ4, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.349, upper: 0.349, max_change_per_sample: 0.15}
    - {index: 15, name: finger_actuator_targets/rh_A_FFJ3, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.262, upper: 1.571, max_change_per_sample: 0.15}
    - {index: 16, name: finger_actuator_targets/rh_A_FFJ0, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: 0.0, upper: 3.142, max_change_per_sample: 0.15}
    - {index: 17, name: finger_actuator_targets/rh_A_MFJ4, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.349, upper: 0.349, max_change_per_sample: 0.15}
    - {index: 18, name: finger_actuator_targets/rh_A_MFJ3, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: -0.262, upper: 1.571, max_change_per_sample: 0.15}
    - {index: 19, name: finger_actuator_targets/rh_A_MFJ0, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: 0.0, upper: 3.142, max_change_per_sample: 0.15}
