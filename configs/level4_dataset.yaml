    - {index: 26, name: finger_actuator_targets/rh_A_LFJ0, group: fingers, units: rad, coordinate_frame: actuator_joint, semantics: absolute, lower: 0.0, upper: 3.142, max_change_per_sample: 0.15}
  safety_reason_codes:
    - {code: none, expert_eligible: true}
    - {code: workspace_clip, expert_eligible: true}
    - {code: orientation_normalized, expert_eligible: true}
    - {code: orientation_rate_limit, expert_eligible: true}
    - {code: actuator_clip, expert_eligible: true}
    - {code: actuator_rate_limit, expert_eligible: true}
    - {code: phase_irrelevant_hold, expert_eligible: true}
    - {code: invalid_numeric, expert_eligible: false}
    - {code: stale_observation, expert_eligible: false}
    - {code: tracking_lost_safe_hold, expert_eligible: false}
    - {code: supervisor_reject, expert_eligible: false}
    - {code: task_abort, expert_eligible: false}

streams:
  state:
    required_for_release: true
    sampling: every_control_sample
    fields: [robot_qpos, robot_qvel, base_pose, base_velocity, wrist_finger_position, wrist_finger_velocity, typed_world_state, stale_missing_masks]
  action:
    required_for_release: true
    sampling: every_control_sample
    fields: [requested, commanded, applied, prior_commanded, prior_applied, request_source, per_field_safety_mask, per_field_safety_reason]
  task_metrics:
    required_for_release: true
    sampling: every_control_sample
    fields: [typed_goal, task_progress, terminal_metric_inputs, terminal_reason]
  phase_safety:
    required_for_release: true
    sampling: every_control_sample
    fields: [online_phase, audited_phase_annotation, phase_relevance_mask, intervention_flag, failure_reason]
  rgb:
    required_for_release: true
    acquisition: synchronous_capture_or_deterministic_render_from_saved_state
    camera_config_required: true
    alignment: episode_frame_and_state_timestamp
    annotations: [object_id, class_id, visibility, box_2d, segmentation_mask, pose_6d, camera_intrinsics, camera_extrinsics]

episode_budget:
  required_total_minimum: 250
  required_total_planning_maximum: 350
  optional_dial_minimum: 0
  optional_dial_planning_range_if_promoted: [30, 40]
  optional_dial_is_additional: true
  groups:
    reach: {minimum_new_accepted: 30, planning_range: [30, 40]}
    pick_place: {minimum_new_accepted: 120, planning_range: [120, 150]}
    push: {minimum_new_accepted: 40, planning_range: [40, 55]}
    button: {minimum_new_accepted: 30, planning_range: [30, 40]}
    failure_correction: {minimum_new_accepted: 30, planning_range: [30, 50]}

counting_rules:
  pick_place_sequence_is_one_episode: true
  derived_reach_pick_place_segments_are_not_additional_episodes: true
  report_episode_and_segment_counts: true
  one_episode_may_satisfy_only_one_coverage_cell: true
  global_surplus_cannot_replace_missing_cell: true

sessions:
  minimum_genuine_sessions: 4
  whole_session_split_only: true
  fresh_process_and_calibration_required: true
  renaming_does_not_create_session: true
  additional_session_assignment: before_collection_or_inspection
  required_metadata: [recording_session_id, operator_id, process_start_timestamp, reset_seed, calibration_record_digest]
  required_slots:
    - {slot: session_a, split: train, purpose: training_pool}
    - {slot: session_b, split: train, purpose: training_pool}
    - {slot: session_c, split: validation, purpose: validation_only}
    - {slot: session_d, split: test, purpose: untouched_cross_session_test}

split_policy:
  ownership_unit: complete_recording_session
  normalization_source: train_only
  held_out_object_instances: [block_large, cylinder_tall, puck_heavy]
  held_out_goal_regions: [return_bin_right]
  held_out_training_minimum: 0
  test_influences_tuning: false
  test_influences_thresholds: false
  test_influences_checkpoint_selection: false
  default_cross_operator_claim: false

