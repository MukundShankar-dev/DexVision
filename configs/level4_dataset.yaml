  - {id: push_flat_puck_return_bin_right_boundary, data_group: push, family: flat_puck, object_id: puck_heavy, target_id: return_bin_right, reset_band: near_boundary, split_owner: test, minimum_accepted_by_split: {train: 0, validation: 0, test: 2}}

  # Button: 10 depth/approach/reset cells x 3 episodes = 30.
  - {id: press_008_centered_nominal, data_group: button, button_id: start_button, target_depth_m: 0.008, approach_class: centered, reset_band: nominal, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: press_010_centered_nominal, data_group: button, button_id: start_button, target_depth_m: 0.010, approach_class: centered, reset_band: nominal, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: press_012_centered_nominal, data_group: button, button_id: start_button, target_depth_m: 0.012, approach_class: centered, reset_band: nominal, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: press_014_centered_nominal, data_group: button, button_id: start_button, target_depth_m: 0.014, approach_class: centered, reset_band: nominal, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: press_010_oblique_interior, data_group: button, button_id: start_button, target_depth_m: 0.010, approach_class: oblique, reset_band: interior, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: press_012_oblique_interior, data_group: button, button_id: start_button, target_depth_m: 0.012, approach_class: oblique, reset_band: interior, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: press_009_centered_boundary, data_group: button, button_id: start_button, target_depth_m: 0.009, approach_class: centered, reset_band: near_boundary, split_owner: validation, minimum_accepted_by_split: {train: 0, validation: 3, test: 0}}
  - {id: press_013_oblique_boundary, data_group: button, button_id: start_button, target_depth_m: 0.013, approach_class: oblique, reset_band: near_boundary, split_owner: validation, minimum_accepted_by_split: {train: 0, validation: 3, test: 0}}
  - {id: press_011_left_offset_test, data_group: button, button_id: start_button, target_depth_m: 0.011, approach_class: left_offset, reset_band: near_boundary, split_owner: test, minimum_accepted_by_split: {train: 0, validation: 0, test: 3}}
  - {id: press_013_right_offset_test, data_group: button, button_id: start_button, target_depth_m: 0.013, approach_class: right_offset, reset_band: near_boundary, split_owner: test, minimum_accepted_by_split: {train: 0, validation: 0, test: 3}}

  # Failures/corrections: nine required classes, 30 accepted evidence episodes.
  - {id: failure_approach_miss, data_group: failure_correction, failure_class: approach_miss, retryability: retry_once_after_safe_pose, split_owner: train, minimum_accepted_by_split: {train: 4, validation: 0, test: 0}}
  - {id: failure_wrong_contact, data_group: failure_correction, failure_class: wrong_contact, retryability: task_dependent, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: failure_failed_acquisition, data_group: failure_correction, failure_class: failed_acquisition, retryability: retry_once_after_safe_pose, split_owner: train, minimum_accepted_by_split: {train: 4, validation: 0, test: 0}}
  - {id: failure_slip_drop, data_group: failure_correction, failure_class: slip_drop, retryability: abort, split_owner: train, minimum_accepted_by_split: {train: 4, validation: 0, test: 0}}
  - {id: failure_placement_miss, data_group: failure_correction, failure_class: placement_miss, retryability: retry_once_if_still_held, split_owner: validation, minimum_accepted_by_split: {train: 0, validation: 3, test: 0}}
  - {id: failure_premature_release, data_group: failure_correction, failure_class: premature_release, retryability: abort, split_owner: train, minimum_accepted_by_split: {train: 3, validation: 0, test: 0}}
  - {id: failure_timeout, data_group: failure_correction, failure_class: timeout, retryability: task_dependent, split_owner: validation, minimum_accepted_by_split: {train: 0, validation: 3, test: 0}}
  - {id: failure_workspace_violation, data_group: failure_correction, failure_class: workspace_violation, retryability: abort, split_owner: test, minimum_accepted_by_split: {train: 0, validation: 0, test: 3}}
  - {id: failure_joint_limit_violation, data_group: failure_correction, failure_class: joint_limit_violation, retryability: abort, split_owner: test, minimum_accepted_by_split: {train: 0, validation: 0, test: 3}}

failure_and_correction_contract:
  streams: [expert_success, ordinary_failure, policy_rollout, corrective_intervention]
  required_failure_classes: [approach_miss, wrong_contact, failed_acquisition, slip_drop, placement_miss, premature_release, timeout, workspace_violation, joint_limit_violation]
  maximum_retries: 1
  unsafe_failure_retryable: false
  required_metadata: [source_episode_id, trigger_source, failure_class, retryability, intervention_interval, final_outcome]
  source_policy_checkpoint_rule:
    policy_rollout: required
    teleoperation: {value: null, not_applicable_reason: trigger_not_policy_rollout}
    scripted: {value: null, not_applicable_reason: trigger_not_policy_rollout}
  preserve_pre_intervention_frames: true
  preserve_original_terminal_result: true
  unsafe_intervals_are_targets: false

visual_claim:
  version: level4/fixed-camera-visual-matrix-v1
  camera_id: workcell_fixed_v1
  camera_count: 1
  resolution: [640, 480]
  fixed_pose_and_intrinsics: true
  cross_camera_claim: false
  real_world_transfer_claim: false
  source_episode_minima_are_additive_to_episode_budget: false
  duplicate_images_across_splits_allowed: false
  conditions:
    nominal:
      description: frozen nominal renderer and lighting
      minimum_source_episodes_by_split: {train: 8, validation: 4, test: 4}
      entity_coverage: [cuboid, cylinder, flat_puck, start_button, all_targets]
    mild_illumination:
      description: bounded intensity and color-temperature variation with fixed camera
      parameter_bounds: {intensity_multiplier: [0.85, 1.15], color_temperature_shift_k: [-300, 300]}
      minimum_source_episodes_by_split: {train: 4, validation: 2, test: 2}
      entity_coverage: [cuboid, cylinder, flat_puck, start_button]
    partial_occlusion:
      description: one bounded non-target occluder never covering the full goal entity
      parameter_bounds: {maximum_target_mask_occlusion_fraction: 0.35}
      minimum_source_episodes_by_split: {train: 4, validation: 2, test: 2}
      entity_coverage: [cuboid, cylinder, flat_puck, start_button]
    bounded_distractors:
      description: zero to two non-articulated workcell distractors outside task geometry
      parameter_bounds: {distractor_count: [0, 2]}
      minimum_source_episodes_by_split: {train: 4, validation: 2, test: 2}
      entity_coverage: [cuboid, cylinder, flat_puck, start_button, all_targets]

quality_thresholds:
  version: level4/quality-thresholds-v1
  min_mean_tracking_confidence: 0.75
  min_mean_feature_confidence: 0.75
  max_missing_frame_fraction: 0.10
  max_feature_jitter_p95: 0.20
  max_action_jerk_p95: 0.20
  max_joint_limit_hit_fraction: 0.20
  max_workspace_limit_hit_fraction: 0.10
  max_state_action_timestamp_skew_s: 0.005
  max_rgb_state_timestamp_skew_s: 0.017
  max_phase_annotation_disagreement_fraction: 0.10
  require_finite_values: true
  require_recomputed_terminal_result: true
  require_operator_recomputed_label_agreement: true
  require_headless_replay: true

acceptance_workflow:
  ordered_gates: [schema_validation, timestamp_alignment, headless_replay, terminal_metric_recomputation, operator_label_agreement, quality_thresholds, coverage_assignment, split_session_leakage_audit]
  append_only: true
  accepted_episode_mutable: false
  rejected_attempts_preserved: true
  failures_separate_from_expert: true
  corrections_includable_by_explicit_filter_only: true
  checksum_each_accepted_episode: sha256

level3_failure_traceability:
  task_coverage:
    disposition: accepted
    level3_evidence: contact_only_reach_press_depth_only_and_planar_push_only
    level4_requirements: [five_typed_skills, executable_preconditions_goals_and_terminal_metrics, complete_pick_place_sequences]
  session_and_operator_provenance:
    disposition: accepted
    level3_evidence: level2_has_no_genuine_recording_session_ids_and_supports_no_cross_session_claim
    level4_requirements: [mandatory_genuine_recording_session_id, stable_pseudonymous_operator_id, two_train_one_validation_one_untouched_test_session, whole_session_split]
  object_and_fixture_diversity:
    disposition: accepted
    level3_evidence: one_cube_one_button_board_and_three_fixed_reach_targets
    level4_requirements: [three_rigid_object_families, two_instances_per_family, named_fixture_and_targets, test_only_held_out_instances]
  goal_and_reset_coverage:
    disposition: accepted
    level3_evidence: narrow_goals_fixed_initial_states_and_failed_perturbed_rollouts
    level4_requirements: [interior_and_near_boundary_safe_resets, varied_approach_source_target_direction_mass_friction_and_geometry, per_cell_split_minima]
  outcome_and_failure_coverage:
    disposition: accepted
    level3_evidence: training_sets_are_success_dominated_and_recovery_coverage_is_missing
    level4_requirements: [separate_expert_failure_policy_and_correction_streams, nine_failure_classes, conditional_correction_provenance, abort_only_safety_failures]
  observation_and_world_state:
    disposition: accepted
    level3_evidence: no_policy_rgb_and_missing_relations_phase_previous_action_and_safety_state
    level4_requirements: [typed_entity_pose_velocity_support_held_contact_state, prior_commanded_and_applied_actions, causal_phase_and_masks, aligned_fixed_camera_rgb_and_annotations]
  action_layout_and_safety:
    disposition: accepted
    level3_evidence: full_actions_caused_immediate_joint_or_workspace_terminations_and_action_subsets_changed_safety
    level4_requirements: [requested_commanded_and_applied_stages, per_field_bounds_rates_masks_and_reasons, complete_named_layout, sign_continuous_quaternion, phase_specific_relevance, safe_boundary_coverage]
  temporal_and_distribution_hypotheses:
    disposition: deferred_pending_evidence
    level3_evidence: level3_7_found_no_causal_temporal_ambiguity_or_error_accumulation_measurement
    level4_requirements: [preserve_timestamps_and_prior_actions, collect_state_distribution_coverage, do_not_add_sequence_model_yet]
    reconsideration_trigger: controlled_diagnostic_shows_history_resolves_ambiguous_current_states_or_errors_accumulate_after_action_and_safety_repairs
  unsupported_generalization_claims:
    disposition: intentionally_unsupported
    level3_evidence: no_cross_operator_cross_camera_cross_lighting_cross_object_or_open_world_evidence
    level4_requirements: [fixed_camera_claim_only, named_rigid_objects_only, operator_id_recorded_without_cross_operator_claim, deterministic_retry_not_learned_recovery]

non_goals:
  - workcell_scene_implementation_in_level4_0
  - demonstration_collection_in_level4_0
  - full_scale_policy_training
  - skill_qualification
  - learned_regrasp_or_drop_recovery
  - learned_retry_selection
  - arbitrary_object_grasping
  - multi_camera_calibration
  - real_world_visual_transfer
  - end_to_end_vlm_control
  - language_guided_orchestration
