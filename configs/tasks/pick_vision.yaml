# Pick from images (docs/PLAN.md, V3). The pick spec with the privileged object_* observations
# replaced by the two policy cameras (configs/cameras.yaml). Objects, reset, success, failure and
# horizon come from pick.yaml unchanged. Written before any vision policy exists.
extends: pick

# What a policy may observe: what the hand measures itself, plus the camera images.
# The object's pose, shape and size must be read from the images.
observation:
  - palm_position
  - palm_rotation6d
  - hand_qpos
  - hand_qvel
  - fingertip_positions
cameras: [policy_right, policy_left]    # rgb/<camera>, [96, 96, 3] uint8, after each step

# train and val are pick's, so the state and vision policies are trained on the same episodes
# and compared seed by seed. The test range is new and disjoint from every earlier one.
splits:
  train: [0, 100000]
  val: [100000, 110000]
  test: [300000, 310000]
